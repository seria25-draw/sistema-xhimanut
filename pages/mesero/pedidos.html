<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Xhimanut — Mesero</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../../assets/css/global.css"/>
  <link rel="stylesheet" href="../../assets/css/layout.css"/>
  <link rel="stylesheet" href="../../assets/css/mesero.css"/>
</head>
<body>

<div id="layout-container"></div>

<div class="app-container">
  <main class="main-content">

    <!-- ══ SECCIÓN MESAS ══ -->
    <section id="seccion-mesas">

      <div class="page-header">
        <div>
          <h1 id="saludo">Hola 👋</h1>
          <p id="fecha-turno" class="text-muted"></p>
        </div>
      </div>

      <div class="section-title">
        <h2><i class="fa-solid fa-chair"></i> Estado de mesas</h2>
        <p class="text-muted">Selecciona una mesa para tomar el pedido</p>
      </div>

      <div class="mesas-grid" id="mesas-grid"></div>
    </section>

    <!-- ══ SECCIÓN PEDIDO ══ -->
    <section id="seccion-pedido" class="hidden">

      <!-- Header -->
      <div class="pedido-header">
        <button class="btn-volver" onclick="volverAMesas()">
          <i class="fa-solid fa-arrow-left"></i> Volver
        </button>
        <div>
          <h2 id="pedido-mesa-titulo">Mesa —</h2>
          <p class="text-muted" id="pedido-mesa-zona"></p>
        </div>
      </div>

      <div class="pedido-layout">

        <!-- Panel menú -->
        <div class="panel-menu">

          <!-- Tabs categorías -->
          <div class="categorias-tabs" id="categorias-tabs"></div>

          <!-- Buscador -->
          <div class="buscador-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              type="text"
              id="buscador"
              placeholder="Buscar producto..."
              oninput="filtrarProductos()"
            />
          </div>

          <!-- Grid productos -->
          <div class="productos-grid" id="productos-grid"></div>

        </div>

        <!-- Panel carrito -->
        <div class="panel-carrito">

          <div class="carrito-header">
            <h3><i class="fa-solid fa-cart-shopping"></i> Pedido actual</h3>
            <span class="carrito-count-badge" id="carrito-count-badge">0 items</span>
          </div>

          <div class="carrito-items" id="carrito-items">
            <div class="carrito-empty">
              <i class="fa-solid fa-cart-shopping"></i>
              <p>Agrega productos al pedido</p>
            </div>
          </div>

          <div class="carrito-footer">

            <!-- Total -->
            <div class="carrito-total-box">
              <span class="carrito-total-label">Total</span>
              <span class="total-valor" id="carrito-total">$0</span>
            </div>

            <!-- Observaciones -->
            <div>
              <div class="obs-label">
                <i class="fa-solid fa-note-sticky"></i> Observaciones
              </div>
              <textarea
                class="obs-textarea"
                id="observaciones"
                rows="2"
                placeholder="Ej: Sin cebolla, término medio..."
              ></textarea>
            </div>

            <!-- Enviar -->
            <button class="btn-enviar" id="btn-enviar" onclick="enviarPedido()" disabled>
              <i class="fa-solid fa-paper-plane"></i>
              Enviar a cocina / bar
            </button>

          </div>
        </div>
      </div>
    </section>

    <!-- Modal éxito -->
    <div class="modal-overlay hidden" id="modal-exito">
      <div class="modal">
        <div class="modal-icon success">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <h3>¡Pedido enviado!</h3>
        <p id="modal-mensaje">El pedido fue enviado correctamente.</p>
        <button class="btn-enviar" style="margin-top:8px" onclick="cerrarModal()">
          Aceptar
        </button>
      </div>
    </div>

  </main>
</div>

<script src="../../data/db.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/mesero.js"></script>
<script>
  initLayout('Inicio / Mesas');
  initMesero();
</script>

</body>
</html>
