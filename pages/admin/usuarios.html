<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xhimanut - Empleados</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body>

    <!-- Layout compartido (sidebar + navbar) -->
    <div id="layout-container"></div>

    <main class="admin-main">
        <div class="page-content">

            <div class="page-header">
                <div>
                    <h1 class="page-title">Gestión de Empleados</h1>
                    <p class="page-subtitle" id="employees-count">0 empleados registrados</p>
                </div>
                <button class="btn-primary" onclick="openCreateModal()">
                    <i class="fa-solid fa-plus"></i> Nuevo empleado
                </button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-info">
                        <p class="stat-label">Total empleados</p>
                        <p class="stat-value" id="stat-total">0</p>
                    </div>
                    <i class="fa-solid fa-users stat-icon"></i>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <p class="stat-label">En turno ahora</p>
                        <p class="stat-value green" id="stat-active">0</p>
                    </div>
                    <i class="fa-solid fa-clock stat-icon"></i>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <p class="stat-label">Turno mañana</p>
                        <p class="stat-value orange" id="stat-morning">0</p>
                    </div>
                    <i class="fa-solid fa-sun stat-icon"></i>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <p class="stat-label">Turno tarde</p>
                        <p class="stat-value" id="stat-afternoon">0</p>
                    </div>
                    <i class="fa-solid fa-moon stat-icon"></i>
                </div>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Rol</th>
                            <th>Turno</th>
                            <th>Entrada</th>
                            <th>Salida</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="employees-table"></tbody>
                </table>
            </div>

        </div>
    </main>

    <!-- MODAL: Create / Edit -->
    <div class="modal-overlay" id="modal-employee">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Nuevo empleado</h2>
                <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="field-row">
                <div class="field-group">
                    <label class="field-label">Nombre</label>
                    <input type="text" id="field-firstname" class="field-input" placeholder="Juan">
                </div>
                <div class="field-group">
                    <label class="field-label">Apellido</label>
                    <input type="text" id="field-lastname" class="field-input" placeholder="García">
                </div>
            </div>
            <div class="field-group">
                <label class="field-label">Cédula</label>
                <input type="text" id="field-cedula" class="field-input" placeholder="Número de cédula">
            </div>
            <div class="field-group">
                <label class="field-label">Rol</label>
                <select id="field-role" class="field-select">
                    <option value="">Selecciona un rol</option>
                    <option value="mesero">Mesero</option>
                    <option value="cocina-bar">Cocina / Bar</option>
                    <option value="caja">Caja</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>
            <div class="field-group">
                <label class="field-label">Turno</label>
                <select id="field-shift" class="field-select">
                    <option value="">Selecciona un turno</option>
                    <option value="morning">Mañana (08:00 - 16:00)</option>
                    <option value="afternoon">Tarde (16:00 - 23:00)</option>
                </select>
            </div>
            <p class="error-message" id="modal-error"></p>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
                <button class="btn-primary" onclick="saveEmployee()">
                    <i class="fa-solid fa-check"></i>
                    <span id="save-btn-text">Crear empleado</span>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL: Confirm Delete -->
    <div class="modal-overlay" id="modal-confirm">
        <div class="modal">
            <div class="confirm-dialog">
                <div class="confirm-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <h3 class="confirm-title">¿Eliminar empleado?</h3>
                <p class="confirm-text">Esta acción no se puede deshacer</p>
                <p class="confirm-text" id="confirm-name"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeConfirm()">Cancelar</button>
                <button class="btn-primary" onclick="confirmDelete()">
                    <i class="fa-solid fa-trash"></i> Eliminar
                </button>
            </div>
        </div>
    </div>

    <script src="../../data/db.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script src="../../assets/js/admin.js"></script>
    <script>
        initLayout("Usuarios");
        initAdminPage("usuarios");
    </script>

</body>

</html>
