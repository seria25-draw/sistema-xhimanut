<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xhimanut - Configuración</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body>

    <div id="layout-container"></div>

    <main class="admin-main">
        <div class="page-content">

            <div class="page-header">
                <div>
                    <h1 class="page-title">Configuración del Sistema</h1>
                    <p class="page-subtitle">Gestiona los parámetros generales del restaurante</p>
                </div>
                <button class="btn-primary" onclick="guardarConfiguracion()">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar cambios
                </button>
            </div>

            <div class="config-section">
                <div class="config-section-header">
                    <i class="fa-solid fa-gear" style="color:#ea580c;"></i>
                    <h3>Información General</h3>
                </div>
                <div class="config-grid">
                    <div class="field-group">
                        <label class="field-label">Nombre del restaurante</label>
                        <input type="text" id="cfg-nombre" class="field-input" value="Xhimanut">
                    </div>
                    <div class="field-group">
                        <label class="field-label">Número de mesas</label>
                        <input type="number" id="cfg-mesas" class="field-input" value="20">
                    </div>
                    <div class="field-group">
                        <label class="field-label">Teléfono</label>
                        <input type="text" id="cfg-telefono" class="field-input" value="+57 300 123 4567">
                    </div>
                    <div class="field-group">
                        <label class="field-label">Correo electrónico</label>
                        <input type="email" id="cfg-email" class="field-input" value="contacto@xhimanut.com">
                    </div>
                </div>
            </div>

            <div class="config-section">
                <div class="config-section-header">
                    <i class="fa-solid fa-percent" style="color:#ea580c;"></i>
                    <h3>Propinas y Pagos</h3>
                </div>
                <div class="config-grid">
                    <div class="field-group">
                        <label class="field-label">Propina sugerida por defecto</label>
                        <select id="cfg-propina" class="field-select">
                            <option value="5">5%</option>
                            <option value="10" selected>10%</option>
                            <option value="15">15%</option>
                            <option value="20">20%</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label class="field-label">Impuesto (IVA %)</label>
                        <input type="number" id="cfg-iva" class="field-input" value="19">
                    </div>
                </div>
                <div class="config-checkbox">
                    <label class="checkbox-label">
                        <input type="checkbox" id="cfg-dividir" checked>
                        Permitir dividir cuentas entre comensales
                    </label>
                </div>
            </div>

            <div class="config-section">
                <div class="config-section-header">
                    <i class="fa-solid fa-clock" style="color:#ea580c;"></i>
                    <h3>Horarios y Turnos</h3>
                </div>
                <div class="config-grid config-grid-3">
                    <div class="field-group">
                        <label class="field-label">Apertura</label>
                        <input type="time" id="cfg-apertura" class="field-input" value="08:00">
                    </div>
                    <div class="field-group">
                        <label class="field-label">Cierre</label>
                        <input type="time" id="cfg-cierre" class="field-input" value="23:00">
                    </div>
                    <div class="field-group">
                        <label class="field-label">Cambio de turno</label>
                        <input type="time" id="cfg-turno" class="field-input" value="16:00">
                    </div>
                </div>
            </div>

            <div class="config-section">
                <div class="config-section-header">
                    <i class="fa-solid fa-bell" style="color:#ea580c;"></i>
                    <h3>Alertas y Notificaciones</h3>
                </div>
                <div class="config-checks">
                    <label class="checkbox-label">
                        <input type="checkbox" id="cfg-alerta-stock" checked>
                        Alertar cuando el stock esté bajo (menos de 10 unidades)
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="cfg-alerta-orden" checked>
                        Alertar si una orden tarda más de 20 minutos
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="cfg-notif-mesero" checked>
                        Notificar al mesero cuando una orden está lista
                    </label>
                </div>
            </div>

        </div>
    </main>

    <script src="../../data/db.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script src="../../assets/js/admin.js"></script>
    <script>
        initLayout("Configuracion");
        initAdminPage("configuracion");
    </script>

</body>

</html>
